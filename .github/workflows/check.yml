name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/check_data.mjs
      - run: node tools/test_engine.mjs
      - run: node tools/test_stats.mjs
      - run: node tools/test_stats_more.mjs
      - run: node tools/test_recipes.mjs
