name: update-data
# 開獎日晚間(台灣時間約 21:30)抓一次官網最新期數;驗證通過才 commit,失敗不會動到既有資料。
on:
  schedule:
    # 台灣彩券(539 每天、大樂透 二五、威力彩 一四):主排程 21:29,GitHub cron 常延遲,後面兩個是備援
    # (沒有新資料時不會 commit,多跑無害)
    - cron: "29 13 * * 1-6"   # UTC 13:29 = 台灣 21:29
    - cron: "29 15 * * 1-6"   # 備援:台灣 23:29
    - cron: "29 17 * * 1-6"   # 備援:台灣 01:29(隔日)
    # 加州539(Fantasy 5 每天 18:30 開獎):主排程台灣 12:29,後面兩個是備援
    - cron: "29 4 * * *"      # UTC 04:29 = 台灣 12:29
    - cron: "29 6 * * *"      # 備援:台灣 14:29
    - cron: "29 8 * * *"      # 備援:台灣 16:29
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # 兩個來源互不影響:任一邊失敗(官網改版、當機、資料衝突)時,另一邊抓到的資料照樣驗證、commit、發布;
      # 失敗的那邊在最後一步讓整個工作標示為失敗(GitHub 會寄通知)。各遊戲在腳本內也各自判斷,一個遊戲出錯不擋其他遊戲。
      - name: 抓取官網最新開獎
        id: tw
        continue-on-error: true
        run: node tools/fetch_latest.mjs
      - name: 抓取加州539(加州彩券官網;官網擋台灣 IP,所以只在這裡跑)
        id: ca
        continue-on-error: true
        run: node tools/fetch_ca539.mjs
      - name: 重建 data/*.json
        run: python tools/build_json.py
      - name: 記錄資料更新時間(data/meta.json)
        run: node tools/stamp_meta.mjs
      - name: 驗證資料與測試
        run: |
          node tools/check_data.mjs
          node tools/test_engine.mjs
      - name: Commit 並觸發發布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data history)" ]; then echo "沒有新資料"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data history
          git commit -m "資料更新:$(date -u -d '+8 hours' +%F)"
          # 執行期間若有人推了新 commit,先接上再推(資料檔只由這個工作產生,一般不會衝突)
          git pull --rebase origin main
          git push
          gh workflow run pages.yml
      - name: 檢查期數缺漏(有缺漏只通知,不影響上面已發布的資料)
        id: gaps
        continue-on-error: true
        run: node tools/check_gaps.mjs
      - name: 回報失敗
        if: steps.tw.outcome == 'failure' || steps.ca.outcome == 'failure' || steps.gaps.outcome == 'failure'
        run: |
          echo "台灣官網:${{ steps.tw.outcome }};加州539:${{ steps.ca.outcome }};缺漏檢查:${{ steps.gaps.outcome }}(詳見各步驟的紀錄)"
          exit 1
